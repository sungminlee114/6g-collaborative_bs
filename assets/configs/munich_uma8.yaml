# Munich UMa 8-BS scene (legacy, high-altitude 16-90m)
# Sionna RT built-in munich scene

scene_name: munich
deployment: uma

# RF
frequency: 15.0e9
bandwidth: 400.0e6
num_subcarriers: 1024
guard_band_ratio: 0.1
temperature: 293.0

# TX antenna (BS)
tx_rows: 2
tx_cols: 2
tx_polarization: V

# RX antenna (UE default)
rx_rows: 1
rx_cols: 1
rx_polarization: cross

# BS deployment
num_bs: 8
power_dbm: 40.0
bs_positions:
  - [-210.0, -75.0, 45.0]     # BS0
  - [145.0, -350.0, 30.0]     # BS1
  - [-420.0, -380.0, 35.0]    # BS2
  - [330.0, 100.0, 25.0]      # BS3
  - [-120.0, 200.0, 40.0]     # BS4
  - [280.0, -180.0, 28.0]     # BS5
  - [-350.0, 120.0, 32.0]     # BS6
  - [100.0, 150.0, 22.0]      # BS7

# PathSolver
max_depth: 5
max_num_paths_per_src: 100000
samples_per_src: 100000

# UE sampling
num_ue: 100
sinr_min_db: 2.0
sinr_max_db: 40.0
dist_min: 10.0
dist_max: 100.0

ue_device_types:
  - [1, 1, cross]
  - [1, 2, V]
  - [2, 2, V]

# Dataset
data_dir: assets/data/channels
num_snapshots: 100
pretrain_bs_ids: [0,1,2,3,4,5]
test_bs_ids: [6,7]
